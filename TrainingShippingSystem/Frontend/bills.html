    <div class="container">
        <h2 class="page-title">
            Bills Management
        </h2>
        <!-- Bill Form -->
        <div class="card form-card">
            <div class="card-body">
                <h4 class="mb-4">
                    Bill Form
                </h4>
                <input type="hidden"
                       id="billId">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Bill Number
                        </label>
                        <input type="text"
                               id="billNumber"
                               class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Client
                        </label>
                        <select id="clientId"
                                class="form-select">
                            <option value="">
                                Select Client
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Voyage
                        </label>
                        <select id="voyageId"
                                class="form-select">
                            <option value="">
                                Select Voyage
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Gross Weight
                        </label>
                        <input type="number"
                               step="0.01"
                               id="grossWeight"
                               class="form-control">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">
                            Net Weight
                        </label>
                        <input type="number"
                               step="0.01"
                               id="netWeight"
                               class="form-control">
                    </div>
                </div>
                <button id="saveBillBtn"
                        class="btn btn-primary">
                    Save
                </button>
                <button id="clearBillBtn"
                        class="btn btn-secondary">
                    Clear
                </button>
                <div id="message"></div>
            </div>
        </div>
        <!-- Advanced Search -->
        <div class="card mt-4">
            <div class="card-body">
                <h4 class="mb-4">
                    Advanced Search
                </h4>
                <div class="row">
                    <!-- Bill Number Search -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Bill Number
                        </label>
                        <input type="text"
                               id="searchBillNumber"
                               class="form-control"
                               placeholder="Enter Bill Number">
                    </div>
                    <!-- Client Filter -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Client
                        </label>
                        <select id="searchClientId"
                                class="form-select">
                            <option value="">
                                All Clients
                            </option>
                        </select>
                    </div>
                    <!-- Voyage Filter -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">
                            Voyage
                        </label>
                        <select id="searchVoyageId"
                                class="form-select">
                            <option value="">
                                All Voyages
                            </option>
                        </select>
                    </div>
                </div>
                <button id="searchBillsBtn"
                        class="btn btn-primary">
                    Search
                </button>
                <button id="clearSearchBtn"
                        class="btn btn-secondary">
                    Clear Search
                </button>
            </div>
        </div>
        <!-- Bills Table -->
        <div class="table-container mt-4">
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-dark">
                        <tr>
                            <!-- ID -->
                            <th>
                                ID
                                <button type="button"
                                        class="btn btn-sm btn-outline-light sort-btn"
                                        data-column="ID">
                                    ↕
                                </button>
                            </th>
                            <!-- Bill Number -->
                            <th>
                                Bill Number
                                <button type="button"
                                        class="btn btn-sm btn-outline-light sort-btn"
                                        data-column="BillNumber">
                                    ↕
                                </button>
                            </th>
                            <!-- Client -->
                            <th>
                                Client
                            </th>
                            <!-- Voyage -->
                            <th>
                                Voyage
                            </th>
                            <!-- Gross Weight -->
                            <th>
                                Gross Weight
                                <button type="button"
                                        class="btn btn-sm btn-outline-light sort-btn"
                                        data-column="GrossWeight">
                                    ↕
                                </button>
                            </th>
                            <!-- Net Weight -->
                            <th>
                                Net Weight
                                <button type="button"
                                        class="btn btn-sm btn-outline-light sort-btn"
                                        data-column="NetWeight">
                                    ↕
                                </button>
                            </th>
                            <!-- Actions -->
                            <th>
                                Actions
                            </th>
                        </tr>
                    </thead>
                    <tbody id="billsTableBody">
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <nav aria-label="Bills pagination">
                <ul id="pagination"
                    class="pagination justify-content-center">
                </ul>
            </nav>
        </div>
