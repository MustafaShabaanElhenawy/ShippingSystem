<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Bills</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                Shipping Management System

            </a>

            <div class="collapse navbar-collapse show" id="navbarNav">
                <ul class="navbar-nav ms-auto flex-row gap-0.5">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clients.html">Clients</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="voyages.html">Voyages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="bills.html">Bills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="containers.html">Containers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html">Reports</a>
                    </li>
                </ul>
            </div>

        </div>

    </nav>



    <div class="container">

        <h2 class="page-title">
            Bills Management
        </h2>


        <div class="card form-card">

            <div class="card-body">

                <h4 class="mb-4">
                    Bill Form
                </h4>


                <input type="hidden"
                       id="billId">


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Bill Number
                        </label>

                        <input type="text"
                               id="billNumber"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Client
                        </label>

                        <select id="clientId"
                                class="form-select">

                            <option value="">
                                Select Client
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Voyage
                        </label>

                        <select id="voyageId"
                                class="form-select">

                            <option value="">
                                Select Voyage
                            </option>

                        </select>

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Gross Weight
                        </label>

                        <input type="number"
                               step="0.01"
                               id="grossWeight"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Net Weight
                        </label>

                        <input type="number"
                               step="0.01"
                               id="netWeight"
                               class="form-control">

                    </div>

                </div>


                <button id="saveBillBtn"
                        class="btn btn-primary">

                    Save

                </button>


                <button id="clearBillBtn"
                        class="btn btn-secondary">

                    Clear

                </button>


                <div id="message"></div>

            </div>

        </div>



        <div class="table-container">

            <div class="row mb-3">

                <div class="col-md-6">

                    <input type="text"
                           id="searchInput"
                           class="form-control"
                           placeholder="Search bills...">

                </div>

            </div>


            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Bill Number</th>
                            <th>Client</th>
                            <th>Voyage</th>
                            <th>Gross Weight</th>
                            <th>Net Weight</th>
                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="billsTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script src="js/bills.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
