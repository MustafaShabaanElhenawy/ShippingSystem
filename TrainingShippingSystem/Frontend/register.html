<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up - Shipping Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="css/auth.css" rel="stylesheet" />
</head>
<body class="auth-page">

    <div class="container">
        <div class="card auth-card mx-auto">
            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <div class="auth-logo">&#9875;</div>
                    <h4 class="mt-3 mb-1">Create your account</h4>
                    <p class="text-muted mb-0">Shipping Management System</p>
                </div>

                <div id="message"></div>

                <form id="registerForm" novalidate>

                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input type="text" id="username"
                               class="form-control form-control-lg"
                               autocomplete="username" maxlength="30" />
                        <div id="usernameError" class="text-danger small mt-1"></div>
                        <div class="form-text password-hint">
                            3-30 characters: letters, numbers, dot or underscore.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label" for="password">Password</label>
                        <div class="input-group">
                            <input type="password" id="password"
                                   class="form-control form-control-lg"
                                   autocomplete="new-password" maxlength="100" />
                            <button type="button"
                                    class="btn btn-outline-secondary toggle-password"
                                    data-target="#password">
                                Show
                            </button>
                        </div>
                        <div class="progress mt-2" style="height: 6px;">
                            <div id="strengthBar" class="progress-bar" style="width: 0%;"></div>
                        </div>
                        <small id="strengthText" class="text-muted"></small>
                        <div id="passwordError" class="text-danger small mt-1"></div>
                        <div class="form-text password-hint">
                            At least 8 characters, with a letter and a number.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="confirmPassword">Confirm password</label>
                        <div class="input-group">
                            <input type="password" id="confirmPassword"
                                   class="form-control form-control-lg"
                                   autocomplete="new-password" maxlength="100" />
                            <button type="button"
                                    class="btn btn-outline-secondary toggle-password"
                                    data-target="#confirmPassword">
                                Show
                            </button>
                        </div>
                        <div id="confirmPasswordError" class="text-danger small mt-1"></div>
                    </div>

                    <button type="submit" id="registerBtn" class="btn btn-dark btn-lg w-100">
                        <span class="spinner-border spinner-border-sm me-2 d-none"
                              id="registerSpinner"></span>
                        <span id="registerBtnText">Create Account</span>
                    </button>

                </form>

                <p class="text-center text-muted mt-4 mb-0">
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>

            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
