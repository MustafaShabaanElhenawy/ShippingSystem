<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Clients</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


    <!-- Navigation -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                Shipping Management System

            </a>


            <div class="collapse navbar-collapse show" id="navbarNav">
                <ul class="navbar-nav ms-auto flex-row gap-0.5">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="clients.html">Clients</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="voyages.html">Voyages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="bills.html">Bills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="containers.html">Containers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html">Reports</a>
                    </li>
                </ul>
            </div>

        </div>

    </nav>



    <div class="container">

        <h2 class="page-title">
            Clients Management
        </h2>


        <!-- Form -->

        <div class="card form-card">

            <div class="card-body">

                <h4 class="mb-4">
                    Client Form
                </h4>


                <input type="hidden"
                       id="clientId">


                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Name
                        </label>

                        <input type="text"
                               id="name"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input type="email"
                               id="email"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Phone
                        </label>

                        <input type="text"
                               id="phone"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Address
                        </label>

                        <input type="text"
                               id="address"
                               class="form-control">

                    </div>

                </div>


                <button id="saveClientBtn"
                        class="btn btn-primary">

                    Save

                </button>


                <button id="clearClientBtn"
                        class="btn btn-secondary">

                    Clear

                </button>


                <div id="message"></div>

            </div>

        </div>



        <!-- Clients List -->

        <div class="table-container">

            <div class="row mb-3">

                <div class="col-md-6">

                    <input type="text"
                           id="searchInput"
                           class="form-control"
                           placeholder="Search clients...">

                </div>

            </div>


            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Address</th>
                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="clientsTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>



    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>


    <script src="js/clients.js">
    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


</body>

</html>
