<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Voyages</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand"
               href="index.html">

                Shipping Management System

            </a>


            <div class="collapse navbar-collapse show" id="navbarNav">
                <ul class="navbar-nav ms-auto flex-row gap-0.5">
                    <li class="nav-item">
                        <a class="nav-link " href="index.html">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="clients.html">Clients</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="voyages.html">Voyages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="bills.html">Bills</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="containers.html">Containers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="reports.html">Reports</a>
                    </li>
                </ul>
            </div>

        </div>

    </nav>



    <div class="container">

        <h2 class="page-title">
            Voyages Management
        </h2>


        <div class="card form-card">

            <div class="card-body">

                <h4 class="mb-4">
                    Voyage Form
                </h4>


                <input type="hidden"
                       id="voyageId">


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Voyage Number
                        </label>

                        <input type="text"
                               id="voyageNumber"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Vessel Name
                        </label>

                        <input type="text"
                               id="vesselName"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            ETA
                        </label>

                        <input type="datetime-local"
                               id="eta"
                               class="form-control">

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            ETD
                        </label>

                        <input type="datetime-local"
                               id="etd"
                               class="form-control">

                    </div>

                </div>


                <button id="saveVoyageBtn"
                        class="btn btn-primary">

                    Save

                </button>


                <button id="clearVoyageBtn"
                        class="btn btn-secondary">

                    Clear

                </button>


                <div id="message"></div>

            </div>

        </div>



        <div class="table-container">

            <div class="row mb-3">

                <div class="col-md-6">

                    <input type="text"
                           id="searchInput"
                           class="form-control"
                           placeholder="Search voyages...">

                </div>

            </div>


            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">

                        <tr>

                            <th>ID</th>
                            <th>Voyage Number</th>
                            <th>Vessel</th>
                            <th>ETA</th>
                            <th>ETD</th>
                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="voyagesTableBody">
                    </tbody>

                </table>

            </div>

        </div>

    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <script src="js/voyages.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
